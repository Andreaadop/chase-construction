<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chase Construction — Digital Marketing Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Hoefler Text';
      src: url('brand-fonts/hoefler-text.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --green:      #2c573d;
      --green-d:    #1c3028;
      --blue:       #1e3f71;
      --beige:      #c3b49d;
      --brown:      #a07d67;
      --brown-d:    #342319;
      --linen:      #f0ece4;
      --snow:       #faf8f5;
      --ink:        #1a1614;
      --text-mid:   #4a3f38;
      --text-muted: #7a6e66;
      --text-dark:  #1a1614;
      --text-light: #f0ece4;
      --line-d:     rgba(26,22,20,.12);
      --line-l:     rgba(195,180,157,.18);
      --amber:      #d97706;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      background: var(--snow);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: 'Hoefler Text', Georgia, serif;
      font-weight: normal;
    }

    /* ── PAGE WRAPPER ── */
    .page {
      width: 297mm;
      min-height: 210mm;
      display: flex;
      flex-direction: column;
      background: var(--snow);
      overflow: hidden;
    }

    @media print {
      @page { size: A4 landscape; margin: 0; }
      body { margin: 0; }
      .page { width: 297mm; height: 210mm; overflow: hidden; page-break-after: avoid; break-after: avoid; }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- content goes here -->
  </div>
</body>
</html>
